<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuyin</title>
<meta name="theme-color" content="#eff6ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%233b82f6'/><path d='M50 26 L72 50 L50 74 L28 50 Z' fill='none' stroke='%23fff' stroke-width='7' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HAAVK Tech Soft UI
   友好好接近的界面 + 哈夫克冷调科技蓝
   全部圆角 · 彩色柔影 · 宽松呼吸感 · 冷灰白底
   ============================================================ */
:root{
  --blue-50:#eff6ff;
  --blue-100:#dbeafe;
  --blue-500:#3b82f6;
  --blue-600:#2563eb;
  --blue-700:#1d4ed8;
  --slate-50:#f8fafc;
  --slate-100:#f1f5f9;
  --slate-200:#e2e8f0;
  --slate-300:#cbd5e1;
  --slate-400:#94a3b8;
  --slate-500:#64748b;
  --gray-600:#4b5563;
  --gray-800:#1f2937;
  --gray-900:#111827;
  --slate-800:#1e293b;
  --r-2xl:20px;
  --r-3xl:28px;
  --r-full:999px;
  --sans:"Albert Sans","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"Fragment Mono","Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--gray-600);
  background:var(--blue-50);
  background-image:
    radial-gradient(ellipse 780px 460px at 8% -6%, rgba(59,130,246,.16), transparent 62%),
    radial-gradient(ellipse 620px 420px at 96% 2%, rgba(147,197,253,.24), transparent 60%),
    radial-gradient(ellipse 900px 520px at 50% 110%, rgba(219,234,254,.7), transparent 70%);
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
#q,input,textarea{user-select:text;-webkit-user-select:text}

/* ---------- 通用 ---------- */
.wrap{position:relative;z-index:1;max-width:1152px;margin:0 auto;padding:0 22px}

.card{
  background:#fff;
  border:0;
  border-radius:var(--r-3xl);
  box-shadow:0 20px 45px -22px rgba(59,130,246,.20), 0 8px 20px -12px rgba(203,213,225,.55);
  transition:transform .3s ease-in-out, box-shadow .3s ease-in-out;
}
.card-hover:hover{
  transform:translateY(-4px);
  box-shadow:0 28px 60px -24px rgba(59,130,246,.34), 0 12px 26px -14px rgba(203,213,225,.5);
}

.sec{padding:64px 0}
@media(min-width:768px){ .sec{padding:92px 0} }

/* 搜索区需要让下拉面板浮在上层，后续区块不能盖住它 */
.search-sec{position:relative;z-index:40}

.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.sec-dot{
  width:42px;height:42px;flex:none;border-radius:var(--r-full);
  background:rgba(59,130,246,.10);color:var(--blue-600);
  display:grid;place-items:center;font-size:17px;
}
.sec-head h2{
  font-size:22px;font-weight:700;color:var(--gray-900);letter-spacing:-.2px;
  white-space:nowrap;
}
.sec-head .en{
  font-family:var(--mono);font-size:10.5px;letter-spacing:2.4px;color:var(--slate-400);
  text-transform:uppercase;white-space:nowrap;
}
.sec-head .spacer{flex:1;min-width:20px}
.sec-chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;color:var(--blue-600);
  background:rgba(59,130,246,.10);padding:6px 13px;border-radius:var(--r-full);
  white-space:nowrap;font-weight:500;
}

/* ---------- 导航（无框、随页面滚动，不吸顶） ---------- */
.nav{
  position:relative;z-index:30;
  background:transparent;
  border:0;
}
.nav-in{
  max-width:1152px;margin:0 auto;padding:28px 22px 0;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand-mark{
  width:42px;height:42px;flex:none;border-radius:var(--r-full);
  background:linear-gradient(140deg,var(--blue-500),var(--blue-600));
  box-shadow:0 14px 28px -14px rgba(59,130,246,.7);
  display:grid;place-items:center;color:#fff;font-size:16px;
  transition:all .3s ease-in-out;
}
.brand:hover .brand-mark{transform:translateY(-2px) scale(1.04);box-shadow:0 20px 36px -16px rgba(59,130,246,.85)}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{font-size:20px;font-weight:700;color:var(--gray-900);letter-spacing:-.3px}
.brand-t small{font-family:var(--mono);font-size:9.5px;letter-spacing:2.2px;color:var(--slate-400)}

/* ---------- 首屏（无卡片，直接铺在页面上） ---------- */
.hero{padding:52px 0 26px;position:relative}
@media(min-width:768px){ .hero{padding:80px 0 40px} }
.hero-wash{
  position:absolute;pointer-events:none;z-index:0;
  width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%, rgba(59,130,246,.17), rgba(147,197,253,.06) 60%, transparent 72%);
  right:-180px;top:-190px;
}
.hero-wash.two{
  width:380px;height:380px;left:-140px;top:180px;
  background:radial-gradient(circle at 50% 40%, rgba(191,219,254,.46), transparent 70%);
}
.hero-in{position:relative;z-index:2;max-width:720px}
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:2.4px;
  color:var(--blue-600);text-transform:uppercase;
  background:rgba(59,130,246,.10);padding:8px 16px;border-radius:var(--r-full);
  margin-bottom:28px;font-weight:500;
}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--blue-500);display:block}
.hero h1{
  font-size:clamp(34px,5.6vw,60px);
  line-height:1.22;letter-spacing:-1.4px;font-weight:700;color:var(--gray-900);
  max-width:720px;
}
.hero h1 em{font-style:normal;color:var(--blue-600)}
.hero-lead{
  margin-top:24px;max-width:540px;
  font-size:16px;line-height:1.9;color:var(--gray-600);font-weight:400;
}
.hero-meta{
  margin-top:38px;display:flex;gap:12px;flex-wrap:wrap;
}
.meta-pill{
  display:flex;flex-direction:column;gap:4px;
  background:#fff;padding:16px 24px;border-radius:var(--r-2xl);
  box-shadow:0 16px 34px -22px rgba(59,130,246,.36), 0 6px 16px -12px rgba(203,213,225,.6);
  transition:all .3s ease-in-out;
}
.meta-pill:hover{transform:translateY(-2px);box-shadow:0 22px 42px -22px rgba(59,130,246,.5)}
.meta-pill small{font-family:var(--mono);font-size:9.5px;letter-spacing:1.8px;color:var(--slate-400);text-transform:uppercase}
.meta-pill b{font-size:16px;font-weight:600;color:var(--gray-900);font-family:var(--mono);letter-spacing:.6px}

/* ---------- 搜索 ---------- */
.search-card{padding:22px}
@media(min-width:768px){ .search-card{padding:26px} }
.search-row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}

/* 搜索引擎下拉：自绘圆角面板，统一软 UI */
.engine-select{position:relative;flex:none}
.engine-btn{
  display:flex;align-items:center;gap:11px;
  border:0;cursor:pointer;outline:none;
  background:var(--slate-100);color:var(--blue-600);
  font-family:var(--mono);font-size:11.5px;letter-spacing:1.8px;font-weight:600;
  padding:0 18px;height:100%;min-height:52px;border-radius:var(--r-2xl);
  transition:all .3s ease-in-out;white-space:nowrap;
}
.engine-btn:hover{background:#e8effc;color:var(--blue-700);transform:translateY(-1px);box-shadow:0 14px 28px -18px rgba(59,130,246,.55)}
.engine-btn:active{transform:scale(.97)}
.engine-btn.open{background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.35)}
.engine-btn:focus-visible{box-shadow:0 0 0 3px rgba(59,130,246,.45)}
.engine-btn .ico{font-size:13px;opacity:.85}
.engine-btn .caret{font-size:9px;opacity:.7;transition:transform .3s ease-in-out;margin-left:2px}
.engine-btn.open .caret{transform:rotate(180deg)}

.engine-menu{
  position:absolute;top:calc(100% + 10px);left:0;z-index:800;
  min-width:100%;width:max-content;
  background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:0;border-radius:var(--r-2xl);
  box-shadow:0 32px 64px -20px rgba(30,64,175,.34), 0 14px 30px -12px rgba(203,213,225,.55), 0 0 0 1px rgba(59,130,246,.07);
  padding:8px;display:flex;flex-direction:column;gap:4px;
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);
  transition:all .25s cubic-bezier(.22,.68,.3,1);
  user-select:none;
}
.engine-menu.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.engine-opt{
  display:flex;align-items:center;gap:11px;
  border:0;cursor:pointer;text-align:left;width:100%;
  background:transparent;color:var(--gray-600);
  font-family:var(--mono);font-size:11.5px;letter-spacing:1.8px;font-weight:500;
  padding:12px 16px;border-radius:calc(var(--r-2xl) - 8px);
  transition:all .25s ease-in-out;white-space:nowrap;
}
.engine-opt .ico{font-size:13px;flex:none;width:16px;text-align:center;opacity:.8}
.engine-opt:hover{background:rgba(59,130,246,.09);color:var(--blue-600);transform:translateX(2px)}
.engine-opt:active{transform:scale(.98)}
.engine-opt.sel{background:rgba(59,130,246,.13);color:var(--blue-600);font-weight:600}
.engine-opt:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.45);background:rgba(59,130,246,.09)}
.engine-opt .check{margin-left:auto;font-size:11px;color:var(--blue-500);opacity:0;transition:opacity .2s}
.engine-opt.sel .check{opacity:1}
#q{
  flex:1;min-width:180px;border:0;outline:none;
  background:var(--slate-50);color:var(--gray-800);
  font-family:var(--sans);font-size:16px;font-weight:400;
  padding:16px 22px;border-radius:var(--r-2xl);
  transition:all .2s ease-in-out;
}
#q::placeholder{color:var(--slate-400)}
#q:hover{background:#fff}
#q:focus{background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.35)}
.btn-primary{
  border:0;cursor:pointer;
  border-radius:var(--r-2xl);font-weight:500;
  background:var(--blue-500);color:#fff;
  box-shadow:0 14px 30px -14px rgba(59,130,246,.8);
  padding:16px 32px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:2px;
  transition:all .3s ease-in-out;
  min-height:52px;
}
.btn-primary:hover{
  background:var(--blue-600);transform:translateY(-2px);
  box-shadow:0 20px 40px -16px rgba(59,130,246,.9);
}
.btn-primary:active{transform:scale(.95)}
.btn-primary:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.5)}

/* ---------- 网站卡片 ---------- */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
@media(min-width:768px){ .grid{gap:22px} }
.site{
  position:relative;display:flex;align-items:center;gap:15px;
  background:#fff;border:0;border-radius:var(--r-2xl);
  padding:18px;text-decoration:none;color:var(--gray-800);
  box-shadow:0 14px 32px -20px rgba(203,213,225,.9);
  transition:all .3s ease-in-out;
  overflow:hidden;min-height:76px;
}
.site:hover{
  transform:translateY(-4px);
  box-shadow:0 24px 48px -22px rgba(59,130,246,.42), 0 8px 18px -12px rgba(203,213,225,.6);
}
.site:active{transform:scale(.97)}
.site:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.5)}
.site-ico{
  width:46px;height:46px;flex:none;border-radius:var(--r-full);
  background:rgba(59,130,246,.10);color:var(--blue-600);
  display:grid;place-items:center;font-size:20px;
  transition:all .3s ease-in-out;overflow:hidden;position:relative;
}
.site-ico img{
  width:26px;height:26px;display:block;object-fit:contain;
  background:transparent;
}
.site-ico .fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:18px;font-weight:700;color:var(--blue-600);
}
.site:hover .site-ico{background:rgba(59,130,246,.18);transform:scale(1.06)}
.site-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.site-name{
  font-size:15.5px;font-weight:600;color:var(--gray-900);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;
}
.site-tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--slate-400);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.site-arrow{font-size:13px;color:var(--blue-500);opacity:0;transform:translateX(-6px);transition:all .3s ease-in-out;flex:none}
.site:hover .site-arrow{opacity:1;transform:translateX(0)}
.site-edit{
  display:none;flex:none;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;font-weight:500;
  color:var(--blue-600);background:rgba(59,130,246,.10);
  padding:7px 13px;border-radius:var(--r-full);
  text-decoration:none;cursor:pointer;user-select:none;
  transition:all .3s ease-in-out;
}
.site-edit:hover{background:var(--blue-500);color:#fff;box-shadow:0 10px 22px -12px rgba(59,130,246,.9)}
.site-edit:active{transform:scale(.95)}
.site:hover .site-edit{display:inline-flex}
.site:hover .site-arrow{display:none}

.site.add{
  background:rgba(255,255,255,.6);color:var(--slate-400);
  box-shadow:none;border:0;
  box-shadow:inset 0 0 0 2px rgba(191,219,254,.75);
}
.site.add .site-ico{
  background:rgba(59,130,246,.07);color:var(--blue-500);
}
.site.add:hover{
  background:#fff;color:var(--blue-600);
  box-shadow:0 20px 40px -24px rgba(59,130,246,.4), inset 0 0 0 2px rgba(59,130,246,.32);
}
.site.add .site-name{color:inherit}

/* ---------- 底部 ---------- */
.foot-wrap{padding:0 0 46px}
.foot{
  background:var(--slate-800);color:rgba(226,232,240,.86);
  border:0;border-radius:var(--r-3xl);
  box-shadow:0 28px 60px -30px rgba(30,41,59,.6);
  padding:26px 30px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.foot-l{display:flex;align-items:center;gap:13px}
.foot-dot{width:34px;height:34px;border-radius:var(--r-full);background:rgba(59,130,246,.22);display:grid;place-items:center;color:#93c5fd;font-size:13px;flex:none}
.foot-t{display:flex;flex-direction:column;gap:3px}
.foot-t b{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:-.1px}
.foot-t small{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:rgba(148,163,184,.9)}
.foot-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot-r a,.foot-r span{
  font-family:var(--mono);font-size:10px;letter-spacing:1.4px;
  color:rgba(203,213,225,.8);padding:8px 15px;border-radius:var(--r-full);
  background:rgba(255,255,255,.07);text-decoration:none;
  transition:all .3s ease-in-out;white-space:nowrap;
}
.foot-r a:hover{background:rgba(59,130,246,.35);color:#fff;transform:translateY(-2px)}

/* ---------- 进场 ---------- */
.fade{opacity:0;transform:translateY(14px);animation:fade .65s cubic-bezier(.22,.68,.3,1) forwards}
@keyframes fade{to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-delay:0ms !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
  .fade{opacity:1;transform:none}
}

/* ---------- 响应式 ---------- */
@media(max-width:820px){
  .nav-in{padding:20px 22px 4px}
  .hero{padding:44px 0 20px}
  .hero-wash{width:330px;height:330px;right:-150px;top:-150px}
  .hero-wash.two{width:240px;height:240px;left:-120px;top:190px}
  .hero h1{font-size:clamp(28px,7.6vw,40px);line-height:1.3}
  .hero-lead{font-size:14.5px;line-height:1.8}
  .sec{padding:52px 0}
  .sec-head h2{font-size:19px}
  .sec-head .en{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .site{padding:15px;gap:12px;min-height:70px}
  .site-ico{width:40px;height:40px;font-size:17px}
  .site-name{font-size:14.5px}
  .foot{padding:22px 22px;flex-direction:column;align-items:flex-start}
  .foot-r{width:100%}
}
@media(max-width:480px){
  .wrap{padding:0 16px}
  .meta-pill{padding:12px 18px}
  .meta-pill b{font-size:14.5px}
  .grid{grid-template-columns:1fr}
  .engine-select{flex:1}
  .engine-btn{width:100%;justify-content:center}
  .engine-menu{width:100%}
  #q{font-size:15px;padding:15px 18px}
  .btn-primary{width:100%;padding:15px 24px}
}
</style>
</head>
<body>

<!-- ===== 导航 ===== -->
<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="#">
      <span class="brand-mark">◈</span>
      <span class="brand-t">
        <b>Kuyin</b>
        <small>HATSUNE MIKU MASTER</small>
      </span>
    </a>
  </div>
</nav>

<div class="wrap">

  <!-- ===== 首屏 ===== -->
  <header class="hero">
    <span class="hero-wash"></span>
    <span class="hero-wash two"></span>
    <div class="hero-in fade">
      <div class="kicker"><i></i>Hatsune Miku Master</div>
      <h1>把常用的 <em>每个入口</em><br>整理成一处。</h1>
      <p class="hero-lead">
        常用站点、工具与日常。所有的跳转都被收纳在同一个地方，
        需要的时候，一眼就能找到。
      </p>
      <div class="hero-meta">
        <div class="meta-pill"><small>Local Time</small><b id="clock">--:--:--</b></div>
        <div class="meta-pill"><small>Date</small><b id="date">----.--.--</b></div>
      </div>
    </div>
  </header>

  <!-- ===== 搜索 ===== -->
  <section class="sec search-sec" style="padding-top:14px">
    <div class="sec-head fade" style="animation-delay:.06s">
      <span class="sec-dot">⌕</span>
      <h2>搜索</h2>
      <span class="en">Search</span>
      <span class="spacer"></span>
      <span class="sec-chip" id="engineChip">BING</span>
    </div>
    <div class="search-card card fade" style="animation-delay:.1s">
      <div class="search-row">
        <div class="engine-select" id="engineSelect">
          <button class="engine-btn" id="engineBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="选择搜索引擎">
            <span class="ico" id="engineIco">◍</span>
            <span id="engineLabel">BING</span>
            <span class="caret">▼</span>
          </button>
          <div class="engine-menu" id="engineMenu" role="listbox" aria-label="搜索引擎列表">
            <button class="engine-opt sel" type="button" role="option" data-key="bing"   data-ico="◍" aria-selected="true"><span class="ico">◍</span>BING<span class="check">✓</span></button>
            <button class="engine-opt"     type="button" role="option" data-key="google" data-ico="⊕" aria-selected="false"><span class="ico">⊕</span>GOOGLE<span class="check">✓</span></button>
            <button class="engine-opt"     type="button" role="option" data-key="github" data-ico="◈" aria-selected="false"><span class="ico">◈</span>GITHUB<span class="check">✓</span></button>
          </div>
        </div>
        <input id="q" type="search" placeholder="输入关键词，回车搜索…" autocomplete="off" spellcheck="false" aria-label="搜索关键词">
        <button class="btn-primary" id="go">SEARCH</button>
      </div>
    </div>
  </section>

  <!-- ===== 网站导航 ===== -->
  <section class="sec" id="sites" style="padding-top:10px">
    <div class="sec-head fade" style="animation-delay:.06s">
      <span class="sec-dot">◫</span>
      <h2>网站导航</h2>
      <span class="en">Quick Access</span>
      <span class="spacer"></span>
      <span class="sec-chip" id="siteCount">— LINKS</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ===== 页脚 ===== -->
  <div class="foot-wrap">
    <footer class="foot">
      <div class="foot-l">
        <span class="foot-dot">◈</span>
        <span class="foot-t">
          <b>Hatsune Miku Master</b>
          <small>KUYIN · <span id="year">2026</span></small>
        </span>
      </div>
      <div class="foot-r">
        <a href="https://github.com/lamYinSang/lamYinSang.github.io" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.havvk.ltd/" target="_blank" rel="noopener">HAAVK</a>
        <span>2060208.XYZ</span>
      </div>
    </footer>
  </div>

</div>

<script>
/* ============================================================
   网站列表 —— 加网站只改这个数组
   { name:显示名, url:网址, icon:备用emoji, tag:小字分类, iconSrc:可选自定义图标地址 }
   图标会自动去目标网站抓取 favicon；抓不到时依次降级：
     Google favicon 服务 → 备用 emoji
   ============================================================ */
const SITES = [
  { name:'哔哩哔哩',   url:'https://www.bilibili.com',    icon:'📺', tag:'BILIBILI',   iconSrc:'https://i0.hdslb.com/bfs/static/jinkela/long/images/512.png' },
  { name:'抖音',       url:'https://www.douyin.com',      icon:'🎵', tag:'DOUYIN' },
  { name:'QQ邮箱',     url:'https://mail.qq.com',         icon:'📧', tag:'QQ MAIL',    iconSrc:'https://mail.qq.com/favicon.ico' },
  { name:'网易邮箱',   url:'https://mail.163.com',        icon:'✉️', tag:'163 MAIL',   iconSrc:'https://mail.163.com/favicon.ico' },
  { name:'豆包',       url:'https://www.doubao.com',      icon:'🤖', tag:'AI · DOUBAO',iconSrc:'https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/favicon/new-doubao/128x128.png' },
  { name:'ChatGPT',    url:'https://chatgpt.com',        icon:'💬', tag:'AI · OPENAI' },
  { name:'DeepSeek',   url:'https://chat.deepseek.com',   icon:'🐋', tag:'AI · DEEPSEEK', iconSrc:'https://fe-static.deepseek.com/chat/icon-180.png' },
  { name:'小番茄',     url:'https://www.xiaofanqie.com',  icon:'🍅', tag:'图片混淆' },
  { name:'研招网',     url:'https://yz.chsi.com.cn',      icon:'🎓', tag:'CHSI · 考研', iconSrc:'https://t1.chei.com.cn/yz/favicon.ico' },
  { name:'码道',       url:'https://www.madooo.com',      icon:'🧩', tag:'TOOLS' },
  { name:'Nexus Mods', url:'https://www.nexusmods.com',   icon:'⬢', tag:'MODS · 游戏' },
  { name:'GitHub',     url:'https://github.com',         icon:'◈', tag:'CODE · 代码', iconSrc:'https://github.githubassets.com/favicons/favicon.svg' }
];

/* GitHub 仓库（编辑按钮跳转用） */
const GH_USER   = 'lamYinSang';
const GH_REPO   = 'lamYinSang.github.io';
const GH_BRANCH = 'main';
const GH_FILE   = 'index.html';
const EDIT_URL  = (GH_USER && GH_REPO)
  ? `https://github.com/${GH_USER}/${GH_REPO}/edit/${GH_BRANCH}/${GH_FILE}`
  : '';

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

/* ---------- 时钟 ---------- */
function tick(){
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('date').textContent  = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
}
tick(); setInterval(tick, 1000);
$('year').textContent = new Date().getFullYear();

/* ---------- 网站卡片 ---------- */
const grid = $('grid');
SITES.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'site fade';
  card.style.animationDelay = (0.04 * (i % 8) + 0.08) + 's';

  const link = document.createElement('a');
  link.href = s.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.style.cssText = 'position:absolute;inset:0;z-index:1';
  link.setAttribute('aria-label', s.name);

  const ico = document.createElement('span');
  ico.className = 'site-ico';
  /* 图标三级降级：自定义地址 → Google favicon 服务 → emoji */
  const domain = (() => { try { return new URL(s.url).hostname; } catch(e){ return ''; } })();
  const sources = [];
  if(s.iconSrc) sources.push(s.iconSrc);
  if(domain) sources.push('https://www.google.com/s2/favicons?sz=128&domain=' + domain);

  const fb = document.createElement('span');
  fb.className = 'fallback';
  fb.textContent = s.icon;
  ico.appendChild(fb);

  const img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';
  img.style.display = 'none';
  let si = 0;
  img.addEventListener('load', () => {
    /* Google 失效时会返回 16px 占位图，尺寸太小则视为失败 */
    if(img.naturalWidth < 24){ si++; tryNext(); return; }
    img.style.display = 'block';
    fb.style.display = 'none';
  });
  img.addEventListener('error', () => { si++; tryNext(); });
  function tryNext(){
    if(si < sources.length){ img.src = sources[si]; }
    else { img.style.display = 'none'; fb.style.display = 'grid'; }
  }
  if(sources.length){ tryNext(); }
  ico.appendChild(img);

  const body = document.createElement('span');
  body.className = 'site-body';
  body.innerHTML = `<span class="site-name">${s.name}</span><span class="site-tag">${s.tag}</span>`;

  const arrow = document.createElement('span');
  arrow.className = 'site-arrow';
  arrow.textContent = '↗';

  const edit = document.createElement('a');
  edit.className = 'site-edit';
  edit.textContent = '编辑';
  edit.style.position = 'relative';
  edit.style.zIndex = '2';
  edit.href = EDIT_URL || '#';
  edit.target = '_blank';
  edit.rel = 'noopener noreferrer';
  edit.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    if (EDIT_URL){ window.open(EDIT_URL, '_blank', 'noopener'); }
    else{ alert('还没有配置 GitHub 仓库地址。\n请打开 index.html，把 GH_USER / GH_REPO 改成你自己的。'); }
  });

  card.appendChild(link);
  card.appendChild(ico);
  card.appendChild(body);
  card.appendChild(arrow);
  card.appendChild(edit);
  grid.appendChild(card);
});

const addCard = document.createElement('a');
addCard.className = 'site add fade';
addCard.style.animationDelay = '0.12s';
addCard.href = EDIT_URL || '#';
addCard.target = '_blank';
addCard.rel = 'noopener noreferrer';
addCard.innerHTML = `<span class="site-ico">＋</span>
  <span class="site-body"><span class="site-name">添加网站</span><span class="site-tag">EDIT ON GITHUB</span></span>`;
addCard.addEventListener('click', e => {
  if (!EDIT_URL){
    e.preventDefault();
    alert('还没有配置 GitHub 仓库地址。\n请打开 index.html，把 GH_USER / GH_REPO 改成你自己的。');
  }
});
grid.appendChild(addCard);
$('siteCount').textContent = SITES.length + ' LINKS';

/* ---------- 搜索 ---------- */
const ENGINES = {
  bing:   q => 'https://www.bing.com/search?q=' + encodeURIComponent(q),
  google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
  github: q => 'https://github.com/search?q=' + encodeURIComponent(q)
};
let engineKey = 'bing';

const engineBtn   = $('engineBtn');
const engineMenu  = $('engineMenu');
const engineLabel = $('engineLabel');
const engineIco   = $('engineIco');

function setEngine(key, ico){
  engineKey = key;
  engineLabel.textContent = key.toUpperCase();
  engineIco.textContent = ico || '◍';
  $('engineChip').textContent = key.toUpperCase();
  engineMenu.querySelectorAll('.engine-opt').forEach(o => {
    const on = o.dataset.key === key;
    o.classList.toggle('sel', on);
    o.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
function openMenu(v){
  engineMenu.classList.toggle('show', v);
  engineBtn.classList.toggle('open', v);
  engineBtn.setAttribute('aria-expanded', v ? 'true' : 'false');
  if(v){
    const cur = engineMenu.querySelector('.engine-opt.sel');
    if(cur) cur.focus();
  }
}

engineBtn.addEventListener('click', e => {
  e.stopPropagation();
  openMenu(!engineMenu.classList.contains('show'));
});
engineMenu.addEventListener('click', e => {
  const opt = e.target.closest('.engine-opt');
  if(!opt) return;
  setEngine(opt.dataset.key, opt.dataset.ico);
  openMenu(false);
  engineBtn.focus();
});
document.addEventListener('click', e => {
  if(!$('engineSelect').contains(e.target)) openMenu(false);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') openMenu(false);
});
engineBtn.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if(!engineMenu.classList.contains('show')) openMenu(true);
  }
});

function doSearch(){
  const q = $('q').value.trim();
  if(!q) return;
  window.open(ENGINES[engineKey](q), '_blank', 'noopener');
}
$('go').addEventListener('click', doSearch);
$('q').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

/* ---------- 滚动进场 ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if(en.isIntersecting){ en.target.classList.add('fade'); io.unobserve(en.target); }
  });
}, {threshold:.1});
document.querySelectorAll('.sec-head, .search-card').forEach(el => {
  el.style.opacity = '0';
  io.observe(el);
});
</script>
</body>
</html>
